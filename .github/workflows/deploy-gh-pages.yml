name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - testing
  workflow_dispatch:

permissions:
  contents: write

# Keep main and testing deploys independent so they don't cancel each other.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Resolve deploy target
        id: vars
        run: |
          repo="${{ github.event.repository.name }}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$repo/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"
            echo "dest=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          BASE_PATH: ${{ steps.vars.outputs.base }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Empty for main (site root), "testing" for the testing branch.
          destination_dir: ${{ steps.vars.outputs.dest }}
          # Keep the other branch's folder intact instead of wiping the whole branch.
          keep_files: true
